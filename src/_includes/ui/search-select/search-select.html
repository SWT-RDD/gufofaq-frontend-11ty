{# ui/search-select 的展示片段（元件庫頁 include 它）：示範一顆 `<select class="searchSelect">`
     該長什麼樣。畫面上看到的輸入框與下拉都不在這份 markup 裡——`ui/search-select/search-select.js`
     在 DOMContentLoaded 時把這顆原生 select 藏到無障礙樹外、就地建出一顆 combobox 替身，
     原生 select 留在 DOM 內繼續當唯一資料來源。
     消費頁：5-7 稽核日誌的三顆篩選（操作類型／使用者／群組）——操作類型有 ~120 個選項，
     原生 select 只能一顆一顆捲，使用者沒有任何辦法把想找的那幾顆問出來。 #}
<div class="form-group row mobile-col">
    <div class="label label-md">
        <label for="demoSearchSelect" class="control-label">可搜尋單選</label>
    </div>
    <div class="field col-12-sm">
        {# data-placeholder + data-placeholder-key＝§4-2「資料槽」正典（同 ui/multi-select）。
             **`selected` 要真的標在那一顆 option 上**：本元件關閉時輸入框顯示的是已選項的標籤，
             而它讀的是原生 select 的 selectedIndex——沒有 `selected` 時瀏覽器會挑第一顆，
             於是切版演的那一態與 React 的初值可以合法地不一樣（那是逐位元組比對抓得到的）。 #}
        <select id="demoSearchSelect" class="form-control searchSelect" data-placeholder="請選擇" data-placeholder-key="common.pleaseSelect">
            <option value="">全部</option>
            <option value="a">選項一</option>
            <option value="b" selected>選項二</option>
            <option value="c">選項三</option>
        </select>
    </div>
</div>
