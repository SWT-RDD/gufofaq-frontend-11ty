{# 展示片段：元件庫頁（`pages/components/component.html`）的「Switch」那一節 include 它，
     示範關閉態與開啟態兩顆孤立的開關長什麼樣。
     ⚠️ **生產 markup 不長這樣**——生產的每一顆都要有可及名稱綁定（`id` ＋ `<label for>`，
     或迴圈裡的 `aria-labelledby`），照這份抄會做出一排同名的無名開關。逐字契約見 `_switch.scss` 檔頭。
     四顆各自帶 `aria-label` ＋ `data-i18n-aria-label`：開關沒有可見字面，
     少了名稱它們在報讀器上就是四顆「切換按鈕」——展示頁也是 dist 頁，同樣會被輔具讀到。
     四顆而不是兩顆：**停用態要能被孤立地看到**。它在生產頁上不是沒有落點——5-5-1 的成員列，
     平台角色持有者那一列的「啟用」與「管理員」兩顆就是「停用且已勾」（租戶端改不動那一列）；
     這裡四顆並排是為了讓四種組合一眼比得出來。停用**且開著**那一顆特別要演：它證明軌道仍然
     停在「開」的那一側、沒有被停用底色蓋掉，而那一態的軌道走的是專用的 `--toggle-on-disabled`
     （沿用可用態的綠會讓停用把手只剩 1.34:1，見 `_switch.scss`）。 #}
<div class="flex-row gap-20">
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="關閉態示範" data-i18n-aria-label="comp.switchDemoOff">
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="開啟態示範" data-i18n-aria-label="comp.switchDemoOn" checked>
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="停用態示範" data-i18n-aria-label="comp.switchDemoDisabled" disabled>
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="停用但開著示範" data-i18n-aria-label="comp.switchDemoDisabledOn" checked disabled>
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
</div>
