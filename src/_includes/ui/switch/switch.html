{# 展示片段：元件庫頁（`pages/components/component.html`）的「Switch」那一節 include 它，
     示範四種組合（關／開／停用／停用且開著）的孤立開關長什麼樣。
     ⚠️ **生產 markup 不長這樣**——生產的每一顆都要有可及名稱綁定（`id` ＋ `<label for>`，
     或迴圈裡的 `aria-labelledby`），照這份抄會做出一排同名的無名開關。逐字契約見 `_switch.scss` 檔頭。
     四顆各自帶 `aria-label`：開關沒有可見字面，少了名稱它們在報讀器上就是四顆「切換按鈕」
     ——展示頁也是 dist 頁，同樣會被輔具讀到。
     **那四顆 `aria-label` 不掛 `data-i18n`**（§4-2）：它們是 showcase 自己加的示範態名，
     出貨時不帶過去，掛 key 就是在 `en.json` 裡種四顆永遠不會被讀到的條目，而孤兒 key
     那張網擋不到它（它有引用點）。字面寫成語言中立的識別字，英文模式讀起來一樣通。
     四顆而不是兩顆：**停用態要能被孤立地看到**。它在生產頁上不是沒有落點——5-5-1 的成員列，
     平台角色持有者那一列的「啟用」與「管理員」兩顆就是「停用且已勾」（租戶端改不動那一列）；
     這裡四顆並排是為了讓四種組合一眼比得出來。停用**且開著**那一顆特別要演：它證明軌道仍然
     停在「開」的那一側、沒有被停用底色蓋掉，而那一態的軌道走的是專用的 `--toggle-on-disabled`
     （沿用可用態的綠會讓停用把手只剩 1.34:1，見 `_switch.scss`）。 #}
<div class="flex-row gap-20">
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="switch demo: off">
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="switch demo: on" checked>
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="switch demo: disabled" disabled>
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
    <label class="switch">
        <input type="checkbox" class="switch-checkbox" role="switch" aria-label="switch demo: disabled + on" checked disabled>
        <span class="switch-box">
            <span class="switch-btn"></span>
        </span>
    </label>
</div>
