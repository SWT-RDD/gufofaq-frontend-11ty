{#
  每頁筆數選擇器（page-size / per-page）。放在頁面層 pager 旁的 wrapper——**不進 pagination 原子**：
  那顆原子只負責頁碼本身的 markup，是不加料的既有契約，每頁筆數屬於它外面的一層。
  業務 <select>：值交給 React 讀去重新分頁/查詢，
  只掛 hook class `js-page-size`、切版**不**假造行為（GUIDELINE §5）。
  **選中值與同頁 pagination 同源**：兩者都吃頁面的 `perPage`（§6：耦合的衍生值不可只開放一半——
  一邊把 20 寫死在元件裡、另一邊落回 pagination 的預設 10，畫面就會同時出現「每頁 20 筆」與
  「共 12 頁」，而 115÷20＝6）。使用頁在 include 兩者之前 set 一次 perPage 即可；未 set 時
  沿用 pagination 的預設 10。
  選項 10/20/50/100 是**切版自訂的級距**，不宣稱後端出處：各使用頁的後端上限並不相同
  （product 的稽核清單上限 `AUDIT_PAGE_LIMIT_MAX` 是 1000、`get_file_records` 的 `size` 上界
  `RECORDS_PAGE_SIZE_MAX` 是 100），所以「100＝後端上限」這個說法對多數頁面是假的。
  內部變數用元件專屬名 pageSizeOptions／pageSizeValue（§6）。
#}
{% set pageSizeOptions = [10, 20, 50, 100] %}
{% set pageSizeValue = perPage or 10 %}
<div class="page-size">
    <span class="page-size-text" data-i18n="pagination.perPagePrefix">每頁</span>
    <select class="form-control select-sm singleSelect page-size-select js-page-size" aria-label="每頁筆數" data-i18n-aria-label="pagination.perPageAriaLabel">
        {% for size in pageSizeOptions %}
        <option value="{{ size }}"{% if size == pageSizeValue %} selected{% endif %}>{{ size }}</option>
        {% endfor %}
    </select>
    <span class="page-size-text" data-i18n="pagination.perPageSuffix">筆</span>
</div>
