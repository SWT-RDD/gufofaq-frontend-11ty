# 推上 master 時自動 build 並發布 dist/ 到 GitHub Pages，
# 讓大家用瀏覽器開 https://swt-rdd.github.io/gufofaq-frontend-11ty/ 看切版。
# 一次性設定：GitHub repo → Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
# dist/ 在 .gitignore 內（build 產物不進版控），故由本流程現建現部署，不需 gh-pages 分支。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # 也可在 Actions 頁手動觸發

# GitHub Pages 部署所需權限（官方 deploy-pages 用 OIDC）
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，**新 push 不砍掉進行中的那一次**（官方 Pages starter 也是 false）。
# 這個 repo 直推 master，連兩次 push 很常見：cancel-in-progress: true 會在第二次 push 進來時
# 把第一次殺在 deploy-pages 中途——那一步已經在對 Pages 服務寫入，砍在半途留下的是一個
# 沒有人驗過的中間狀態，而省下的只是幾分鐘的 runner 時間。排隊即可。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # 單一真實來源：本機 / CI 同一版 Node
          cache: npm

      - run: npm ci

      # ── 檔案衛生（pre-commit；本機那一份的同一份設定）─────────────────────────
      #
      # **這一步在 master 上尤其不能少**：這個 repo 直推 master，push 就是部署，
      # 沒有 PR 階段可以攔——`ci.yml` 的 `branches-ignore: [master]` 讓它跑不到這條路。
      # 而檔案衛生那一族（行尾空白、檔尾換行、混用 CRLF/LF、壞掉的 YAML/JSON、只差大小寫
      # 的檔名）在 CI 沒有任何其他對應物，不在這裡跑一次的話，實際被使用的那條路上
      # 那一層等於「有人記得裝就有」——正是 `.pre-commit-config.yaml` 檔頭要避免的狀態。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 每一顆 hook 各自建一個獨立的環境。快取鍵綁設定檔內容，改了 rev 或加了 hook 就自然失效重建。
      - name: 快取 pre-commit 的 hook 環境
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      # `--show-diff-on-failure`：那幾顆是會改檔的 hook，在 CI 上改完就沒了、只留一個「Failed」，
      # 這一旗標把它們改了什麼印出來。
      - name: pre-commit（檔案衛生）
        run: pre-commit run --all-files --show-diff-on-failure

      # lint → build → test，任何一關紅就擋下部署。
      # 拆成三個 step 而不是一個 `npm run check`：擠在一格裡的話，Actions 頁只看得到
      # 「那一格紅了」，要展開日誌才知道是哪一關。master 以外的分支與 PR 走 ci.yml。
      - name: lint（零裸 hex／零裸色彩函式）
        run: npm run lint:css

      - name: build
        run: npm run build

      - name: test（GUIDELINE 的規則寫成的斷言）
        run: npm test

      # v4 起 upload-pages-artifact 預設不收 dotfile（.nojekyll 之類的會被靜靜吃掉）。
      # 這個站 dist/ 目前一顆 dotfile 都沒有，所以不必開 include-hidden-files；
      # 哪天真的要發 dotfile，記得在這裡補上，否則它不會報錯、只會不見。
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 真瀏覽器那一層。與 build 平行跑（各自 build 一次 dist），所以牌面時間是兩者的**最大值**
  # 而不是相加；部署等兩邊都綠。
  #
  # 為什麼要擋部署：它驗的是「英文模式下逐頁 runtime、而且實際觸發互動」——
  # 那是 GUIDELINE §8 檢查清單裡唯一靜態掃描做不到的一條。這個 repo 直推 master、
  # push 就是部署，沒有 PR 階段可以攔；不在這裡擋，英文模式壞掉的版本會直接上線。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 瀏覽器二進位檔約 150MB，每次重抓要一分多鐘。快取鍵綁 lockfile：
      # @playwright/test 升版時 Playwright 會要求對應版本的瀏覽器，鍵跟著失效才不會拿到舊的。
      - name: 快取 Playwright 的瀏覽器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run e2e

      # 失敗時把 trace／截圖留下來——e2e 的紅在文字上常常只是一句逾時，
      # 而 trace 裡看得到當下的 DOM 與是誰擋住了點擊。
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
